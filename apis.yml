aid: opgg
name: OPGG
description: >-
  OP.GG is the world's leading League of Legends statistics and performance
  tracking platform. Founded in Seoul, South Korea and launched in 2013, it grew
  from a LoL stats search engine into a global gaming platform serving tens of
  millions of monthly active users across games including League of Legends,
  Valorant, Teamfight Tactics, Overwatch 2, and PUBG. OP.GG surfaces summoner
  ranks, win rates, champion mastery, builds, tier lists, match history, and
  live meta trends. Its programmatic surface centers on an official, hosted
  Model Context Protocol (MCP) server that gives AI agents access to LoL, TFT,
  and Valorant game data, plus first-party AI-readable ai.json summoner/match
  snapshot endpoints advertised in its published llms.txt. OP.GG is backed by
  500 Global, SBVA, DS Asset Management, Dunamu & Partners, and others.
