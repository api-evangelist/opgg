server:
  name: opgg-mcp
  title: OP.GG MCP Server
  description: >-
    Official Model Context Protocol server that provides AI agents with access
    to OP.GG game data for League of Legends, Teamfight Tactics, and Valorant.
  transport: http
  url: https://mcp-api.op.gg/mcp
  license: MIT
  repository: https://github.com/opgginc/opgg-mcp
  registry: '@opgginc/opgg-mcp'
  install:
    smithery: npx -y @smithery/cli@latest install @opgginc/opgg-mcp --client claude --key {SMITHERY_API_KEY}
  notes: >-
    Most tools require a desired_output_fields parameter to select which fields
    to return (dot/array/brace path syntax), reducing payload size.
